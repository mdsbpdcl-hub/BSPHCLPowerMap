<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bihar Power Map – Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/*LEAFLET_CSS*/
</style>
<style>
:root{
  --bar:#0f1b2d;--bar2:#16263d;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--bg:#f1f5f9;--panel:#ffffff;--hi:#0e7490;--hiS:#ecfeff;
  --k765:#7a4828;--k400:#dc2626;--k220:#16a34a;--k132:#2563eb;
  --sb:#2a78d6;--nb:#eb6834;
  --good:#15803d;--goodB:#dcfce7;--watch:#a16207;--watchB:#fef3c7;--weak:#b91c1c;--weakB:#fee2e2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
/* top bar */
.top{background:var(--bar);color:#e2e8f0;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap;flex:none}
.logo{width:30px;height:30px;border-radius:7px;background:#facc15;display:grid;place-items:center;flex:none}
.tt{min-width:0;flex:1 1 260px}
.tt b{font-size:15px;font-weight:600;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{font-size:12px;color:#94a3b8}
.seg{display:inline-flex;border:1px solid #334155;border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;color:#cbd5e1;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid #334155}
.seg button.on{background:#facc15;color:#0f172a;font-weight:600}
/* layout */
.shell{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr) 420px;min-height:0}
.lp,.rp{background:var(--panel);overflow:auto;min-height:0}
.lp{border-right:1px solid var(--line);padding:12px 14px}
.rp{border-left:1px solid var(--line);display:flex;flex-direction:column}
#map{min-height:0;background:#e9eef4}
.blk{border-bottom:1px solid var(--line);padding:10px 0 12px}
.blk:last-child{border-bottom:0}
.h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tog{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.tog input{accent-color:var(--hi);width:15px;height:15px;margin:0}
.tog .cnt{margin-left:auto;color:var(--faint);font-size:12px}
.sw{width:22px;height:0;border-top:3px solid;flex:none}
.sw.d{border-top-style:dashed}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.inp:focus{outline:2px solid var(--hi);outline-offset:-1px}
.lgd{display:grid;grid-template-columns:22px 1fr;gap:5px 8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.ramp{height:8px;border-radius:2px;margin-top:6px}
.rlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;position:sticky;top:0;background:#fff;z-index:2}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hi)}
.pane{padding:14px;display:none}
.pane.on{display:block}
.kg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.kg div{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kg div:nth-child(3n){border-right:0}
.kg div:nth-last-child(-n+3){border-bottom:0}
.kg small{display:block;font-size:11.5px;color:var(--muted)}
.kg b{font-size:18px;font-weight:600}
.sec{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;border-top:1px solid var(--line)}
.vb{display:grid;grid-template-columns:62px minmax(0,1fr) 70px;gap:6px;align-items:center;font-size:12.5px;margin:5px 0}
.vb .tr{height:14px;background:#f1f5f9;border-radius:3px;display:flex;overflow:hidden}
.vb .tr i{display:block;height:100%}
.vb .n{text-align:right;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:#f8fafc;position:sticky;top:0;cursor:pointer;user-select:none;z-index:1}
th.s:after{content:" ▲";font-size:9px}th.s.d:after{content:" ▼"}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hiS)}
.tb{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 260px)}
.bd{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px}
.bd.Good{background:var(--goodB);color:var(--good)}.bd.Watch{background:var(--watchB);color:var(--watch)}.bd.Weak{background:var(--weakB);color:var(--weak)}
.bd.Existing{background:var(--goodB);color:var(--good)}.bd.UC{background:var(--watchB);color:var(--watch)}.bd.Proposed{background:#e0e7ff;color:#3730a3}
.bd.SBPDCL{background:#dbeafe;color:#1d4ed8}.bd.NBPDCL{background:#ffedd5;color:#c2410c}
.find{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.find li{border-left:3px solid var(--hi);background:#f8fafc;padding:7px 10px;border-radius:0 6px 6px 0;font-size:13px}
.find li.w{border-left-color:#dc2626}.find li.a{border-left-color:#d97706}
.lk{color:var(--hi);cursor:pointer;font-weight:500}
.lk:hover{text-decoration:underline}
.cmp td:first-child{color:var(--muted)}
.row2{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.row2 .inp{flex:1 1 120px;width:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--hi);color:var(--hi)}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.dhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dhd h3{margin:0;font-size:18px}
.note{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;font-size:13px}
details li{font-size:12.5px;color:var(--ink2);margin:4px 0}
/* leaflet look */
.leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:8px}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5;min-width:200px}
.pp h4{margin:0 0 3px;font-size:14px}
.pp table td{padding:2px 6px 2px 0;border:0;white-space:normal}
.pp table td:first-child{color:var(--muted)}
.dlab{background:transparent;border:0;box-shadow:none;font-size:10.5px;font-weight:600;color:#6b4c80;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;padding:0}
.dlab:before,.slab:before{display:none}
.slab{background:rgba(255,255,255,.88);border:0;box-shadow:none;font-size:10.5px;padding:0 3px;border-radius:2px;color:#0f172a}
.scale-box{background:rgba(255,255,255,.9);padding:4px 8px;border-radius:5px;font-size:11.5px;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.state{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5000}
.state div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 28px;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--hi);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.mtabs{display:none}
@media (max-width:1150px){.shell{grid-template-columns:240px minmax(0,1fr) 360px}}
@media (max-width:900px){
 body{height:auto;display:block}
 .shell{display:flex;flex-direction:column}
 #map{height:62vh;order:1}
 .rp{order:2;border-left:0;border-top:1px solid var(--line)}
 .lp{order:3;border-right:0;border-top:1px solid var(--line)}
 .tb{max-height:60vh}
}
@media (max-width:480px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}.kg div:nth-child(3n){border-right:1px solid var(--line)}.kg div:nth-child(2n){border-right:0}.kg div:nth-last-child(-n+3){border-bottom:1px solid var(--line)}.kg div:nth-last-child(-n+2){border-bottom:0}.top{gap:8px}.tt span{display:none}}
</style>
</head>
<body>
<div class="state" id="st-load"><div><div class="spin"></div>Loading map…</div></div>
<div class="state hide" id="st-err"><div><b>Could not load the data</b><p class="note">Please try again.</p><button class="btn" onclick="boot()">Try again</button></div></div>

<header class="top">
 <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0f172a"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
 <div class="tt"><b>Bihar Power Map — Transmission Network</b><span>Digitised from BSPHCL Comprehensive Bihar Map · 13th Plan edition, rev. Aug 2020</span></div>
 <div class="seg" id="scope"><button data-s="Bihar" class="on">Bihar</button><button data-s="SBPDCL">SBPDCL</button><button data-s="NBPDCL">NBPDCL</button></div>
</header>

<div class="shell">
 <aside class="lp">
  <div class="blk">
   <div class="h">Find</div>
   <input class="inp" type="search" id="find" list="names" placeholder="Sub-station or district…">
   <datalist id="names"></datalist>
  </div>
  <div class="blk">
   <div class="h">Transmission lines</div>
   <label class="tog"><input type="checkbox" data-l="l765" checked><span class="sw" style="border-color:var(--k765)"></span>765 kV</label>
   <label class="tog"><input type="checkbox" data-l="l400" checked><span class="sw" style="border-color:var(--k400)"></span>400 kV</label>
   <label class="tog"><input type="checkbox" data-l="l220" checked><span class="sw" style="border-color:var(--k220)"></span>220 kV</label>
   <label class="tog"><input type="checkbox" data-l="l132" checked><span class="sw" style="border-color:var(--k132)"></span>132 kV</label>
   <div class="note" style="margin-top:4px">Dashed on the map = under construction / proposed</div>
  </div>
  <div class="blk">
   <div class="h">Sub-stations &amp; plants</div>
   <label class="tog"><input type="checkbox" class="kvf" value="765" checked><span id="i765"></span>765 kV<span class="cnt" id="c765"></span></label>
   <label class="tog"><input type="checkbox" class="kvf" value="400" checked><span id="i400"></span>400 kV<span class="cnt" id="c400"></span></label>
   <label class="tog"><input type="checkbox" class="kvf" value="220" checked><span id="i220"></span>220 kV<span class="cnt" id="c220"></span></label>
   <label class="tog"><input type="checkbox" class="kvf" value="132" checked><span id="i132"></span>132 kV<span class="cnt" id="c132"></span></label>
   <label class="tog"><input type="checkbox" class="kvf" value="gen" checked><span id="igen"></span>Generation / HVDC / traction<span class="cnt" id="cgen"></span></label>
   <div style="height:6px"></div>
   <label class="tog"><input type="checkbox" class="stf" value="Existing" checked>Existing<span class="cnt" id="cEx"></span></label>
   <label class="tog"><input type="checkbox" class="stf" value="UC" checked>Under construction<span class="cnt" id="cUC"></span></label>
   <label class="tog"><input type="checkbox" class="stf" value="Proposed" checked>Proposed<span class="cnt" id="cPr"></span></label>
  </div>
  <div class="blk">
   <div class="h">Overlays</div>
   <label class="tog"><input type="checkbox" id="tLab">Sub-station names</label>
   <label class="tog"><input type="checkbox" id="tDl" checked>District names</label>
   <label class="tog"><input type="checkbox" id="tRing">20 km reach circles</label>
   <label class="tog"><input type="checkbox" id="tOrig">Original BSPHCL map (scan)</label>
   <label class="tog hide" id="tStreetW"><input type="checkbox" id="tStreet">Street map underlay</label>
  </div>
  <div class="blk">
   <div class="h">Shade districts by</div>
   <select class="inp" id="shade">
    <option value="band">Overall status (Good / Watch / Weak)</option>
    <option value="cov20">Area within 20 km of a GSS (%)</option>
    <option value="gss_existing">Grid sub-stations (existing)</option>
    <option value="pop_lakh_per_gss">Population per GSS (lakh)</option>
    <option value="mean_dist_km">Average distance to nearest GSS (km)</option>
    <option value="discom">DISCOM</option>
    <option value="none">None</option>
   </select>
   <div id="legend" style="margin-top:8px"></div>
  </div>
 </aside>

 <div id="map"></div>

 <aside class="rp">
  <div class="tabs" id="tabs"><button data-t="sum" class="on">Analysis</button><button data-t="dis">Districts</button><button data-t="reg">Register</button></div>
  <div class="pane on" id="p-sum"></div>
  <div class="pane" id="p-dis"></div>
  <div class="pane" id="p-reg">
   <div class="row2"><input class="inp" type="search" id="q" placeholder="Search…">
    <select class="inp" id="fkv"><option value="">All kV</option><option>765</option><option>400</option><option>220</option><option>132</option><option>Thermal</option><option>Hydro</option><option>HVDC</option><option>TSS</option></select>
    <select class="inp" id="fst"><option value="">All status</option><option>Existing</option><option>UC</option><option>Proposed</option></select></div>
   <div class="tb"><table id="reg"><thead></thead><tbody></tbody></table></div>
   <div class="row2" style="margin-top:8px;align-items:center"><span class="note" id="regCount" style="flex:1"></span><button class="btn" id="copy">Copy CSV</button></div>
  </div>
 </aside>
</div>

<script src="lib/leaflet.js"></script>
<script>
"use strict";
const NF=new Intl.NumberFormat('en-IN');
const fmt=n=>n==null?'–':NF.format(Math.round(n));
const f1=n=>n==null?'–':(Math.round(n*10)/10).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KVC={'765':'#7a4828','400':'#dc2626','220':'#16a34a','132':'#2563eb',Thermal:'#334155',Hydro:'#0e7490',HVDC:'#7e22ce',TSS:'#c026d3'};
const GRID=['765','400','220','132'];
const BCOL={Good:'#16a34a',Watch:'#d97706',Weak:'#dc2626'};
const stLabel=s=>s==='UC'?'Under construction':s;
const kvLabel=s=>GRID.includes(s.kv)?s.kv+' kV':({Thermal:'Thermal generating station',Hydro:'Hydro generating station',HVDC:'HVDC terminal',TSS:'Railway traction sub-station'})[s.kv];
let S=[],D=[],GEO=null,BOUNDS=null,scope='Bihar',map,distLayer,ptLayer,labLayer,ringLayer,origLayer,streetLayer,lineLayers={},markers={};
const BIHAR=[[24.28,83.32],[27.53,88.3]];
const inScope=x=>scope==='Bihar'||x.discom===scope;
const isGrid=s=>GRID.includes(s.kv);

async function boot(){
 $('#st-load').classList.remove('hide');$('#st-err').classList.add('hide');
 try{const g=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
  [S,D,GEO,BOUNDS]=await Promise.all([g('data/substations.json'),g('data/district_stats.json'),g('data/districts.geojson'),g('data/overlay_bounds.json')]);
 }catch(e){$('#st-load').classList.add('hide');$('#st-err').classList.remove('hide');return}
 $('#st-load').classList.add('hide');
 initMap();renderAll();
}
function agg(ds){const a=ds.reduce((o,d)=>{o.area+=d.area_km2;o.pop+=d.population_2011||0;o.cov+=d.cov20*d.area_km2;o.covp+=d.cov20_planned*d.area_km2;o.mean+=d.mean_dist_km*d.area_km2;return o},{area:0,pop:0,cov:0,covp:0,mean:0});a.cov/=a.area;a.covp/=a.area;a.mean/=a.area;return a}
function renderAll(){counts();drawPoints();distLayer.setStyle(distStyle);legend();renderSum();renderDis();renderReg()}

/* ---------- symbols ---------- */
function symHTML(kv,status,big){
 const c=KVC[kv]||'#555',sz=({'765':20,'400':17,'220':14,'132':11})[kv]||13;
 if(kv==='Thermal'||kv==='Hydro')return`<div style="width:15px;height:15px;border:2px solid ${c};background:linear-gradient(#fff 50%,${c} 50%);border-radius:2px"></div>`;
 if(kv==='HVDC'||kv==='TSS')return`<div style="width:13px;height:13px;transform:rotate(45deg);background:${c};border:2px solid #fff;box-shadow:0 0 0 1px ${c}"></div>`;
 if(status==='Proposed')return`<svg width="${sz+5}" height="${sz+5}" viewBox="0 0 20 20"><path d="M10 2 18 17H2z" fill="#fff" stroke="${c}" stroke-width="2.4" stroke-dasharray="3 2"/></svg>`;
 if(status==='UC')return`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#fff;border:2.5px dashed ${c}"></div>`;
 const ring=(kv==='400'||kv==='765')?`box-shadow:0 0 0 2px #fff,0 0 0 3.5px ${c}`:`box-shadow:0 0 0 1.5px ${c}`;
 return`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};border:2px solid #fff;${ring}"></div>`}
function icon(s){const sz=(({'765':20,'400':17,'220':14,'132':11})[s.kv]||15)+8;return L.divIcon({html:symHTML(s.kv,s.status),className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}
['765','400','220','132'].forEach(k=>$('#i'+k).innerHTML=`<span style="display:inline-grid;place-items:center;width:22px">${symHTML(k,'Existing')}</span>`);
$('#igen').innerHTML=`<span style="display:inline-grid;place-items:center;width:22px">${symHTML('Thermal','Existing')}</span>`;

function counts(){const ss=S.filter(inScope);
 GRID.forEach(k=>$('#c'+k).textContent=ss.filter(s=>s.kv===k).length);
 $('#cgen').textContent=ss.filter(s=>!isGrid(s)).length;
 $('#cEx').textContent=ss.filter(s=>s.status==='Existing').length;$('#cUC').textContent=ss.filter(s=>s.status==='UC').length;$('#cPr').textContent=ss.filter(s=>s.status==='Proposed').length}

/* ---------- map ---------- */
function polyCenter(f){let rings=f.geometry.type==='Polygon'?[f.geometry.coordinates[0]]:f.geometry.coordinates.map(p=>p[0]);let best=null,ba=0;
 rings.forEach(r=>{let a=0,cx=0,cy=0;for(let i=0;i<r.length-1;i++){const k=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];a+=k;cx+=(r[i][0]+r[i+1][0])*k;cy+=(r[i][1]+r[i+1][1])*k}if(Math.abs(a)>ba){ba=Math.abs(a);best=[cy/(3*a),cx/(3*a)]}});return best}
function initMap(){
 if(map)return;
 map=L.map('map',{zoomSnap:.25,zoomDelta:.5}).fitBounds(BIHAR);
 map.attributionControl.setPrefix('');map.attributionControl.addAttribution('Network: BSPHCL map (2020) · Boundaries: Census 2011');
 L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
 map.createPane('dist').style.zIndex=300;map.createPane('lines').style.zIndex=350;map.createPane('rings').style.zIndex=360;
 const b=[[BOUNDS.south,BOUNDS.west],[BOUNDS.north,BOUNDS.east]];
 origLayer=L.imageOverlay('data/original_map.jpg',b,{opacity:.9,pane:'lines'});
 for(const k of['l132','l220','l400','l765'])lineLayers[k]=L.imageOverlay(`data/${k}.png`,b,{pane:'lines',opacity:.95}).addTo(map);
 distLayer=L.geoJSON(GEO,{pane:'dist',style:distStyle,onEachFeature:(f,l)=>{
  const d=()=>D.find(x=>x.district===f.properties.district);
  l.on('click',()=>openDist(f.properties.district));
  l.on('mouseover',()=>l.setStyle({weight:2.5,color:'#0e7490'}));l.on('mouseout',()=>distLayer.resetStyle(l));
  l.bindTooltip(()=>{const x=d();return`<b>${esc(x.district)}</b> · ${x.discom}<br>${x.gss_existing} grid sub-stations · ${x.cov20}% area within 20 km<br>Status: ${x.band} (${x.score}/100)`},{sticky:true})}}).addTo(map);
 labLayer=L.layerGroup();GEO.features.forEach(f=>L.tooltip({permanent:true,direction:'center',className:'dlab',interactive:false}).setLatLng(polyCenter(f)).setContent(f.properties.district).addTo(labLayer));labLayer.addTo(map);
 ptLayer=L.layerGroup().addTo(map);ringLayer=L.layerGroup();
 document.querySelectorAll('[data-l]').forEach(c=>c.onchange=()=>c.checked?lineLayers[c.dataset.l].addTo(map):map.removeLayer(lineLayers[c.dataset.l]));
 document.querySelectorAll('.kvf,.stf,#tLab').forEach(c=>c.onchange=drawPoints);
 $('#tRing').onchange=()=>$('#tRing').checked?ringLayer.addTo(map):map.removeLayer(ringLayer);
 $('#tDl').onchange=()=>$('#tDl').checked?labLayer.addTo(map):map.removeLayer(labLayer);
 $('#tOrig').onchange=()=>$('#tOrig').checked?origLayer.addTo(map):map.removeLayer(origLayer);
 $('#shade').onchange=()=>{distLayer.setStyle(distStyle);legend()};
 $('#names').innerHTML=S.map(s=>`<option value="${esc(s.name+' — '+s.kv+(isGrid(s)?' kV':''))}">`).join('')+D.map(d=>`<option value="${esc(d.district+' (district)')}">`).join('');
 $('#find').onchange=()=>{const v=$('#find').value;const s=S.find(x=>(x.name+' — '+x.kv+(isGrid(x)?' kV':''))===v);if(s)return flyTo(s.id);const d=D.find(x=>x.district+' (district)'===v||x.district.toLowerCase()===v.toLowerCase());if(d)openDist(d.district)};
 const probe=new Image();probe.onload=()=>$('#tStreetW').classList.remove('hide');probe.src='https://tile.openstreetmap.org/7/94/54.png';
 streetLayer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap',opacity:.5});
 $('#tStreet').onchange=()=>$('#tStreet').checked?streetLayer.addTo(map):map.removeLayer(streetLayer);
}
const SEQ=['#f0f9ff','#bae6fd','#7dd3fc','#38bdf8','#0284c7','#075985'];
const REV={mean_dist_km:1,pop_lakh_per_gss:1};
function rng(k){const v=D.map(d=>d[k]).filter(x=>x!=null);return[Math.min(...v),Math.max(...v)]}
function distStyle(f){const d=D.find(x=>x.district===f.properties.district),k=$('#shade').value,dim=!inScope(d);let fill='#fff',op=0;
 if(k==='band'){fill=BCOL[d.band];op=.2}else if(k==='discom'){fill=d.discom==='SBPDCL'?'#2a78d6':'#eb6834';op=.16}
 else if(k!=='none'){const[a,b]=rng(k);const t=(d[k]-a)/((b-a)||1);fill=SEQ[Math.min(5,Math.floor(t*6))];op=.65}
 return{color:'#8b6fa3',weight:1.1,fillColor:fill,fillOpacity:dim?.02:op,opacity:dim?.3:.9}}
function legend(){const k=$('#shade').value,el=$('#legend');
 if(k==='band')el.innerHTML=`<div class="lgd">${['Good','Watch','Weak'].map(b=>`<span style="width:16px;height:12px;background:${BCOL[b]};opacity:.5;border-radius:2px"></span><span>${b} — ${b==='Good'?'score 70+':b==='Watch'?'50–69':'below 50'}</span>`).join('')}</div>`;
 else if(k==='discom')el.innerHTML=`<div class="lgd"><span style="width:16px;height:12px;background:#2a78d6;opacity:.45"></span><span>SBPDCL (17 districts)</span><span style="width:16px;height:12px;background:#eb6834;opacity:.45"></span><span>NBPDCL (21 districts)</span></div>`;
 else if(k==='none')el.innerHTML='';
 else{const[a,b]=rng(k);el.innerHTML=`<div class="ramp" style="background:linear-gradient(90deg,${SEQ.join(',')})"></div><div class="rlab"><span>${f1(a)}</span><span>${f1(b)}</span></div>${REV[k]?'<div class="note">Darker = higher (worse)</div>':'<div class="note">Darker = higher (better)</div>'}`}}
function drawPoints(){
 ptLayer.clearLayers();ringLayer.clearLayers();markers={};
 const kv=new Set([...document.querySelectorAll('.kvf:checked')].map(c=>c.value)),st=new Set([...document.querySelectorAll('.stf:checked')].map(c=>c.value)),lab=$('#tLab').checked;
 const ord={'132':1,'220':2,'400':3,'765':4};
 [...S].sort((a,b)=>(ord[a.kv]||0)-(ord[b.kv]||0)).forEach(s=>{
  if(!kv.has(isGrid(s)?s.kv:'gen')||!st.has(s.status))return;
  const m=L.marker([s.lat,s.lon],{icon:icon(s),opacity:inScope(s)?1:.3,zIndexOffset:(ord[s.kv]||5)*100,riseOnHover:true,title:s.name});
  m.bindPopup(()=>`<div class="pp"><h4>${esc(s.name)}</h4><table><tr><td>Type</td><td><b style="color:${KVC[s.kv]}">${kvLabel(s)}</b>${s.note?' · '+esc(s.note):''}</td></tr><tr><td>Status</td><td><span class="bd ${s.status}">${stLabel(s.status)}</span></td></tr><tr><td>Owner</td><td>${esc(s.owner)}</td></tr><tr><td>District</td><td><span class="lk" data-open="${esc(s.district)}">${esc(s.district)}</span> · <span class="bd ${s.discom}">${s.discom}</span></td></tr><tr><td>Location</td><td class="mono">${s.lat.toFixed(4)}°N, ${s.lon.toFixed(4)}°E</td></tr></table></div>`);
  if(lab)m.bindTooltip(s.name,{permanent:true,direction:'right',offset:[7,0],className:'slab'});
  m.addTo(ptLayer);markers[s.id]=m;
  if(isGrid(s)&&s.status==='Existing'&&inScope(s))L.circle([s.lat,s.lon],{radius:20000,pane:'rings',color:KVC[s.kv],weight:.6,fillColor:KVC[s.kv],fillOpacity:.05,interactive:false}).addTo(ringLayer);
 })}
document.addEventListener('click',e=>{const a=e.target.closest('[data-open]');if(a){openDist(a.dataset.open)}const f=e.target.closest('[data-fly]');if(f)flyTo(+f.dataset.fly)});
function flyTo(id){const s=S.find(x=>x.id===id);if(!s)return;
 document.querySelectorAll('.kvf,.stf').forEach(c=>c.checked=true);drawPoints();
 if(innerWidth<=900)document.getElementById('map').scrollIntoView({block:'start'});
 map.flyTo([s.lat,s.lon],10,{duration:.8});setTimeout(()=>markers[id]&&markers[id].openPopup(),850)}

/* ---------- tabs ---------- */
function tab(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab(b.dataset.t);if(b.dataset.t==='dis')renderDis()});

/* ---------- analysis ---------- */
function vbars(ss){const max=Math.max(1,...GRID.map(k=>ss.filter(s=>s.kv===k).length));
 return GRID.map(k=>{const e=ss.filter(s=>s.kv===k&&s.status==='Existing').length,p=ss.filter(s=>s.kv===k&&s.status!=='Existing').length;
  return`<div class="vb"><span><b style="color:${KVC[k]}">${k} kV</b></span><span class="tr"><i style="width:${e/max*100}%;background:${KVC[k]}"></i><i style="width:${p/max*100}%;background:repeating-linear-gradient(45deg,${KVC[k]}55 0 4px,#fff 4px 7px)"></i></span><span class="n">${e}${p?` <span style="color:var(--watch)">+${p}</span>`:''}</span></div>`}).join('')+`<div class="note">Solid = existing · hatched = under construction / proposed</div>`}
function renderSum(){
 const ds=D.filter(inScope),ss=S.filter(inScope),g=ss.filter(isGrid),ex=g.filter(s=>s.status==='Existing'),a=agg(ds);
 const ehv=ex.filter(s=>s.kv!=='132').length,noEhv=ds.filter(d=>!d.has_ehv);
 const K=[['Grid sub-stations',ex.length],['Under constr./proposed',g.length-ex.length],['220 kV and above',ehv],['Area within 20 km',f1(a.cov)+'%'],['After planned works',f1(a.covp)+'%'],['Avg distance to GSS',f1(a.mean)+' km'],['Population per GSS',f1(a.pop/1e5/ex.length)+' L'],['Generating stations',ss.filter(s=>['Thermal','Hydro'].includes(s.kv)).length],['Districts',ds.length]];
 const big=ds.filter(d=>d.area_km2>800);
 const weakReach=[...big].sort((x,y)=>x.cov20-y.cov20).slice(0,4);
 const heavy=[...ds].filter(d=>d.pop_lakh_per_gss).sort((x,y)=>y.pop_lakh_per_gss-x.pop_lakh_per_gss).slice(0,4);
 const pipe=g.filter(s=>s.status!=='Existing');
 const lk=d=>`<span class="lk" data-open="${esc(d.district)}">${esc(d.district)}</span>`;
 const F=[];
 F.push(['',`<b>${f1(a.cov)}%</b> of the ${scope==='Bihar'?'state':scope+' area'} lies within 20 km of an existing grid sub-station; projects shown on the map would lift this to <b>${f1(a.covp)}%</b>.`]);
 if(noEhv.length)F.push(['a',`<b>${noEhv.length} district${noEhv.length>1?'s have':' has'} no 220 kV or higher sub-station</b> and depend on 132 kV from neighbours: ${noEhv.map(lk).join(', ')}.`]);
 F.push(['w',`Weakest reach (larger districts): ${weakReach.map(d=>`${lk(d)} ${d.cov20}%`).join(', ')} — farthest points are ${f1(Math.max(...weakReach.map(d=>d.max_dist_km)))} km from a GSS.`]);
 F.push(['w',`Heaviest load base: ${heavy.map(d=>`${lk(d)} ${f1(d.pop_lakh_per_gss)} lakh/GSS`).join(', ')} (Census 2011 population).`]);
 if(pipe.length)F.push(['',`Pipeline on the map: <b>${pipe.length}</b> sub-stations — ${GRID.map(k=>[k,pipe.filter(s=>s.kv===k).length]).filter(x=>x[1]).map(x=>x[1]+' × '+x[0]+' kV').join(', ')}. Many of these may since have been commissioned.`]);
 const cmp=['SBPDCL','NBPDCL'].map(k=>{const dd=D.filter(d=>d.discom===k),aa=agg(dd),gg=S.filter(s=>s.discom===k&&isGrid(s)),ee=gg.filter(s=>s.status==='Existing');return{k,d:dd.length,area:aa.area,pop:aa.pop,ex:ee.length,ehv:ee.filter(s=>s.kv!=='132').length,pl:gg.length-ee.length,cov:aa.cov,mean:aa.mean,ppg:aa.pop/1e5/ee.length,noE:dd.filter(d=>!d.has_ehv).length,weak:dd.filter(d=>d.band==='Weak').length}});
 const own={};g.forEach(s=>{const o=['BSPTCL','PGCIL','BGCL'].includes(s.owner)?s.owner:'Others';own[o]=(own[o]||0)+1});
 $('#p-sum').innerHTML=`<div class="kg">${K.map(k=>`<div><small>${k[0]}</small><b>${typeof k[1]==='number'?fmt(k[1]):k[1]}</b></div>`).join('')}</div>
 <div class="sec">Key findings</div><ul class="find">${F.map(f=>`<li class="${f[0]}">${f[1]}</li>`).join('')}</ul>
 <div class="sec">Sub-stations by voltage</div>${vbars(g)}
 <div class="sec">DISCOM comparison</div>
 <table class="cmp"><thead><tr><th></th><th class="r"><span class="bd SBPDCL">SBPDCL</span></th><th class="r"><span class="bd NBPDCL">NBPDCL</span></th></tr></thead><tbody>
 ${[['Districts','d',fmt],['Area (km²)','area',fmt],['Population 2011 (lakh)','pop',v=>fmt(v/1e5)],['Grid sub-stations','ex',fmt],['220 kV and above','ehv',fmt],['Under constr./proposed','pl',fmt],['Area within 20 km','cov',v=>f1(v)+'%'],['Avg distance to GSS','mean',v=>f1(v)+' km'],['Population per GSS (lakh)','ppg',f1],['Districts without 220 kV+','noE',fmt],['Districts rated Weak','weak',fmt]].map(r=>`<tr style="cursor:default"><td>${r[0]}</td><td class="r">${r[2](cmp[0][r[1]])}</td><td class="r">${r[2](cmp[1][r[1]])}</td></tr>`).join('')}</tbody></table>
 <div class="sec">Ownership</div>${Object.entries(own).map(([k,v])=>`<div class="vb"><span>${k}</span><span class="tr"><i style="width:${v/g.length*100}%;background:#64748b"></i></span><span class="n">${v}</span></div>`).join('')}
 <div class="sec">Method</div>
 <details><summary>How these figures are worked out</summary><ul>
  <li>Sub-stations, voltages and status are read from the BSPHCL Comprehensive Bihar Map (13th Plan edition, revised Aug 2020). Status is as on that map.</li>
  <li>The map was matched to Census 2011 district boundaries; positions are as drawn and approximate (1–3 km). Districts near borders were checked by name.</li>
  <li>Area within 20 km: share of district area within 20 km (straight line) of an existing grid sub-station of 132 kV or above — a guide to 33 kV feeder lengths.</li>
  <li>Overall status (0–100): reach × 0.45, +25 if the district has a 220 kV+ sub-station, up to +30 for low population per GSS. Good ≥ 70, Watch 50–69, Weak &lt; 50.</li>
 </ul></details>`;
}

/* ---------- districts ---------- */
let dSort=['score',-1],curD=null;
const DC=[['district','District'],['discom','DISCOM'],['gss_existing','GSS','r'],['gss_planned','+Plan','r'],['cov20','≤20 km','r'],['pop_lakh_per_gss','L/GSS','r'],['score','Status','r']];
function renderDis(){
 if(curD)return openDist(curD,true);
 const ds=D.filter(inScope).sort((x,y)=>{const[k,o]=dSort;const a=x[k]??-1,b=y[k]??-1;return(a>b?1:a<b?-1:0)*o});
 $('#p-dis').innerHTML=`<div class="note" style="margin-bottom:8px">Click a district for details. Click a heading to sort.</div><div class="tb"><table><thead><tr>${DC.map(([k,l,c])=>`<th data-k="${k}" class="${c||''} ${dSort[0]===k?'s'+(dSort[1]<0?' d':''):''}">${l}</th>`).join('')}</tr></thead><tbody>${ds.map(d=>`<tr data-open="${esc(d.district)}"><td><b>${esc(d.district)}</b>${d.has_ehv?'':' <span title="No 220 kV+ sub-station" style="color:var(--watch)">●</span>'}</td><td><span class="bd ${d.discom}">${d.discom[0]}</span></td><td class="r">${d.gss_existing}</td><td class="r">${d.gss_planned||''}</td><td class="r">${d.cov20}%</td><td class="r">${f1(d.pop_lakh_per_gss)}</td><td class="r"><span class="bd ${d.band}">${d.band} ${d.score}</span></td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:6px"><span style="color:var(--watch)">●</span> no 220 kV or higher sub-station in the district</div>`;
 $('#p-dis').querySelectorAll('th').forEach(th=>th.onclick=()=>{dSort=[th.dataset.k,dSort[0]===th.dataset.k?-dSort[1]:(th.dataset.k==='district'||th.dataset.k==='discom'?1:-1)];renderDis()});
}
function openDist(name,noFly){const d=D.find(x=>x.district===name);if(!d)return;curD=name;tab('dis');
 const ss=S.filter(s=>s.district===name).sort((a,b)=>(+b.kv||0)-(+a.kv||0)||a.name.localeCompare(b.name));
 const K=[['Grid sub-stations',d.gss_existing],['Under constr./proposed',d.gss_planned],['220 kV and above',d.kv765+d.kv400+d.kv220],['Area within 20 km',d.cov20+'%'],['After planned works',d.cov20_planned+'%'],['Farthest point from GSS',f1(d.max_dist_km)+' km'],['Area',fmt(d.area_km2)+' km²'],['Population 2011',f1(d.population_2011/1e5)+' L'],['Population per GSS',f1(d.pop_lakh_per_gss)+' L']];
 $('#p-dis').innerHTML=`<button class="btn back" id="dBack">‹ All districts</button>
 <div class="dhd"><h3>${esc(name)}</h3><span class="bd ${d.discom}">${d.discom}</span><span class="bd ${d.band}">${d.band} · ${d.score}/100</span></div>
 <div class="kg">${K.map(k=>`<div><small>${k[0]}</small><b>${typeof k[1]==='number'?fmt(k[1]):k[1]}</b></div>`).join('')}</div>
 <div class="note">Average distance to the nearest grid sub-station is ${f1(d.mean_dist_km)} km. Nearest 220 kV or higher source is ${f1(d.centroid_to_220_km)} km from the district centre.</div>
 <div class="sec">Points to note</div><ul class="find">${d.flags.length?d.flags.map(f=>`<li class="${/No 220|Only|Large|High/.test(f)?'w':'a'}">${esc(f)}</li>`).join(''):'<li>No concerns on these measures.</li>'}</ul>
 <div class="sec">Sub-stations and plants (${ss.length})</div>
 <div class="tb" style="max-height:none"><table><thead><tr><th>Name</th><th>kV</th><th>Status</th><th>Owner</th></tr></thead><tbody>${ss.map(s=>`<tr data-fly="${s.id}"><td><b>${esc(s.name)}</b>${s.note?`<div class="note">${esc(s.note)}</div>`:''}</td><td><b style="color:${KVC[s.kv]}">${s.kv}</b></td><td><span class="bd ${s.status}">${stLabel(s.status)}</span></td><td>${esc(s.owner)}</td></tr>`).join('')||'<tr><td colspan="4">None on the map</td></tr>'}</tbody></table></div>`;
 $('#dBack').onclick=()=>{curD=null;renderDis();map.flyToBounds(scopeBounds(),{duration:.6})};
 if(!noFly){const f=GEO.features.find(f=>f.properties.district===name);map.flyToBounds(L.geoJSON(f).getBounds(),{padding:[30,30],duration:.7})}
 $('.rp').scrollTop=0;
}

/* ---------- register ---------- */
const RC=[['name','Name'],['kv','kV'],['status','Status'],['district','District'],['owner','Owner']];let rSort=['district',1];
function regRows(){const q=$('#q').value.trim().toLowerCase(),kv=$('#fkv').value,st=$('#fst').value;
 return S.filter(inScope).filter(s=>(!kv||s.kv===kv)&&(!st||s.status===st)&&(!q||[s.name,s.district,s.owner,s.note,s.kv,s.discom].join(' ').toLowerCase().includes(q))).sort((a,b)=>{const[k,o]=rSort;let x=a[k],y=b[k];if(k==='kv'){x=+x||0;y=+y||0}return(x>y?1:x<y?-1:a.name.localeCompare(b.name))*o})}
function renderReg(){const rows=regRows();
 $('#reg thead').innerHTML='<tr>'+RC.map(([k,l])=>`<th data-k="${k}" class="${rSort[0]===k?'s'+(rSort[1]<0?' d':''):''}">${l}</th>`).join('')+'</tr>';
 $('#reg tbody').innerHTML=rows.map(s=>`<tr data-fly="${s.id}"><td><b>${esc(s.name)}</b></td><td><b style="color:${KVC[s.kv]}">${s.kv}</b></td><td><span class="bd ${s.status}">${stLabel(s.status)}</span></td><td>${esc(s.district)}</td><td>${esc(s.owner)}</td></tr>`).join('');
 $('#regCount').textContent=`${rows.length} of ${S.filter(inScope).length} entries`;
 $('#reg thead').querySelectorAll('th').forEach(th=>th.onclick=()=>{rSort=[th.dataset.k,rSort[0]===th.dataset.k?-rSort[1]:1];renderReg()})}
['#q','#fkv','#fst'].forEach(s=>$(s).addEventListener('input',renderReg));
$('#copy').onclick=async()=>{const h=['name','kv','status','owner','district','discom','note','lat','lon'];const csv=[h.join(',')].concat(regRows().map(r=>h.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(','))).join('\n');
 try{await navigator.clipboard.writeText(csv);$('#copy').textContent='Copied ✓'}catch(e){$('#copy').textContent='Copy blocked'}setTimeout(()=>$('#copy').textContent='Copy CSV',1800)};

/* ---------- scope ---------- */
function scopeBounds(){if(scope==='Bihar')return L.latLngBounds(BIHAR);return L.geoJSON({type:'FeatureCollection',features:GEO.features.filter(f=>D.find(d=>d.district===f.properties.district).discom===scope)}).getBounds()}
document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{scope=b.dataset.s;curD=null;document.querySelectorAll('#scope button').forEach(x=>x.classList.toggle('on',x===b));renderAll();map.flyToBounds(scopeBounds(),{duration:.6})});
addEventListener('keydown',e=>{if(e.key==='Escape'&&curD){curD=null;renderDis()}});
boot();
</script>
</body>
</html>
